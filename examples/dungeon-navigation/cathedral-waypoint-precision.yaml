max_concurrent_containers: 4
output_dir: ./runs
model_preparation:
  unity_editor: C:/Program Files/Unity/Hub/Editor/6000.3.4f1/Editor/Unity.exe

nodes:
  - id: train-hard-stop
    type: train
    image: qa-cathedral-training:local
    checkpoint: &parent models/qa-86-waypoint-following-3000/checkpoint.zip
    environment: {id: hard-stop, scene: CathedralTraining, parameters: {movement_drill: hard_stop}}
    trainer: &training {seed: 780000, max_episodes: 2000, total_timesteps: 128000, checkpoint_freq: 0}

  - id: train-doorway
    type: train
    image: qa-cathedral-training:local
    checkpoint: *parent
    environment: {id: doorway, scene: CathedralTraining, parameters: {movement_drill: doorway}}
    trainer: *training

  - id: test-hard-stop
    type: suite
    image: qa-dungeon-trials:local
    agents: [{id: qa-86-hard-stop, model: {node: train-hard-stop, output: onnx}}]
    episodes_per_trial: 25
    environments:
      - {id: cathedral-0, scene: Cathedral, parameters: {<<: &standard {action_limit: 3600, grid_cell_size: 0.25, reject_by_approach: true}, seed_offset: 0}}
      - {id: cathedral-25, scene: Cathedral, parameters: {<<: *standard, seed_offset: 25}}
      - {id: cathedral-50, scene: Cathedral, parameters: {<<: *standard, seed_offset: 50}}
      - {id: cathedral-75, scene: Cathedral, parameters: {<<: *standard, seed_offset: 75}}

  - id: test-hard-stop-wide
    type: suite
    image: qa-dungeon-trials:local
    after: [test-hard-stop]
    agents: [{id: qa-86-hard-stop, model: {node: train-hard-stop, output: onnx}}]
    episodes_per_trial: 25
    environments:
      - {id: cathedral-0, scene: Cathedral, parameters: {<<: &wide {<<: *standard, min_arrival_radius: 0.20}, seed_offset: 0}}
      - {id: cathedral-25, scene: Cathedral, parameters: {<<: *wide, seed_offset: 25}}
      - {id: cathedral-50, scene: Cathedral, parameters: {<<: *wide, seed_offset: 50}}
      - {id: cathedral-75, scene: Cathedral, parameters: {<<: *wide, seed_offset: 75}}

  - id: test-doorway
    type: suite
    image: qa-dungeon-trials:local
    agents: [{id: qa-86-doorway, model: {node: train-doorway, output: onnx}}]
    episodes_per_trial: 25
    environments:
      - {id: cathedral-0, scene: Cathedral, parameters: {<<: &door {<<: *standard, past_visible_doors: true}, seed_offset: 0}}
      - {id: cathedral-25, scene: Cathedral, parameters: {<<: *door, seed_offset: 25}}
      - {id: cathedral-50, scene: Cathedral, parameters: {<<: *door, seed_offset: 50}}
      - {id: cathedral-75, scene: Cathedral, parameters: {<<: *door, seed_offset: 75}}

  - id: collect
    type: finalizer
    image: qa-dungeon-trials:local
    training: {nodes: [train-hard-stop, train-doorway], scripts: []}
    testing: {nodes: [test-hard-stop, test-hard-stop-wide, test-doorway], scripts: []}
