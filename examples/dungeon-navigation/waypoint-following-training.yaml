max_concurrent_containers: 1
output_dir: ./runs
model_preparation:
  unity_editor: C:/Program Files/Unity/Hub/Editor/6000.3.4f1/Editor/Unity.exe

nodes:
  - id: train-waypoint-following
    type: train
    image: qa-cathedral-training:local
    checkpoint: models/qa-86/checkpoint.zip
    environment:
      id: cathedral-waypoints
      scene: CathedralTraining
      parameters: {waypoint_following: true}
    trainer:
      seed: 772000
      max_episodes: 1000
      total_timesteps: 600000
      checkpoint_freq: 5000

  - id: retest-cathedral
    type: suite
    image: qa-dungeon-trials:local
    episodes_per_trial: 100
    environments:
      - {id: cathedral, scene: Cathedral}
    agents:
      - id: qa-86-waypoint-following
        model: {node: train-waypoint-following, output: onnx}

  - id: collect
    type: finalizer
    image: qa-dungeon-trials:local
    training:
      nodes: [train-waypoint-following]
    testing:
      nodes: [retest-cathedral]
