# The two trained policies are archived outputs of the Cathedral training runs.
max_concurrent_containers: 3
output_dir: ./runs
model_preparation:
  unity_editor: C:/Program Files/Unity/Hub/Editor/6000.3.4f1/Editor/Unity.exe

nodes:
  - id: cathedral-comparison
    type: suite
    image: qa-dungeon-trials:local
    episodes_per_trial: 100
    environments:
      - {id: cathedral, scene: Cathedral}
    agents:
      - id: qa-86
        model: models/qa-86/model.onnx
      - id: qa-86-cathedral-1000
        model: models/qa-86-cathedral-1000/model.onnx
      - id: qa-86-cathedral-3000
        model: models/qa-86-cathedral-3000/model.onnx

  - id: collect
    type: finalizer
    image: qa-dungeon-trials:local
    testing:
      nodes: [cathedral-comparison]
      scripts: []
