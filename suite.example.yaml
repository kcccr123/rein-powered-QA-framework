# Copy this file to suite.yaml and replace the image, scenes, and host ONNX paths.
# Run: qa-run-suite suite.yaml

# Your Docker image. Its existing entrypoint must read QA_TRIAL_CONFIG (JSON)
# and write trial artifacts to QA_OUTPUT_DIR.
image: my-trial-image:tag

# Number of episodes to run for each environment/agent pair; positive integer.
episodes_per_trial: 100

# Maximum number of trial containers active at once; positive integer.
max_concurrent_trials: 2

# Host output directory, relative to this YAML file (or an absolute path).
# Each invocation creates a separate suite directory here for status and outputs.
output_dir: ./runs

# Required host Unity Editor. Relative paths resolve beside this YAML.
# Both conversion and the QA Unity runtime pin Inference Engine 2.4.1.
model_preparation:
  unity_editor: C:/Program Files/Unity/Hub/Editor/6000.3.4f1/Editor/Unity.exe
  timeout_seconds: 600 # optional positive integer, default 600

# Add or remove environments. Keep at least one, with a unique, nonempty id.
# scene is required: full build scene path or unique name. The first build scene
# must contain QaPlatformBootstrap; each gameplay scene has one enabled adapter.
environments:
  - id: dungeon
    scene: Dungeon
  - id: arena
    scene: Arena

# Add or remove agents. Keep at least one, with a unique, nonempty id.
# model is required: an existing self-contained ONNX file (no external weights).
# Relative host paths resolve beside this YAML. Each distinct path is converted
# once per suite, then mounted read-only at /qa/model/agent.sentis. Compatible
# models need one float input [1, observationSize] and output [1, actionSize].
agents:
  - id: baseline
    model: models/baseline.onnx
  - id: candidate
    model: models/candidate.onnx

# This example produces 2 environments x 2 agents = 4 trials,
# each running 100 episodes, with at most 2 containers active at once.
